# Build & deploy the Dove Go worker to production (dovego.it), running any new
# D1 migrations first. The scheduled run rebuilds so the embedded crawler data
# trails the collector by at most ~6 hours; user submissions merge live from D1.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Retried: one dependency (italian-transport-core) is a git dep, so every
      # install pulls a tarball from GitHub — which has failed the deploy twice
      # on transient 429/504 while the code was fine. A fix sitting undeployed
      # because of someone else's rate limit is worse than a slow retry.
      - name: Install dependencies (retry transient registry failures)
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "install attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "dependency install failed three times" >&2
          exit 1
      - run: bun run lint
      - run: bun run typecheck
      # Scoped to ./test: a bare `bun test` also picks up the Playwright specs in
      # e2e/, which throw "test() called here" under bun's runner. E2E runs
      # separately via `bun run test:e2e`.
      - run: bun run test
      - run: bun run build:prod
      - run: bun x wrangler d1 migrations apply dovego --remote
      - run: bun x wrangler deploy

  # Post-deploy smoke check against the live site — fails the run if a shipped
  # deploy has a broken shard, detail page or image URL (things unit tests and
  # the build can't see). Retries a few times for edge propagation.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/smoke.ts
